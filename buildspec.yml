version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - npm ci
    pre_build:
      commands:
        - echo "VITE_API_BASE=$VITE_API_BASE" > .env.production
        - cat .env.production
  build:
    commands:
      - npm run build

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - dist/**/*
  base-directory: .
